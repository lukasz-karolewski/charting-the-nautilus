<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Voyage of the Nautilus</title>
<style>
  :root {
    --bg:        #061320;
    --ocean:     #0c2135;
    --ocean-2:   #0a1b2b;
    --land:      #263a4d;
    --land-edge: #4d6c88;
    --grid:      #16304a;
    --ink:       #e7eef5;
    --ink-dim:   #8ba2b8;
    --ink-faint: #566d82;
    --brass:     #f0b429;
    --brass-dim: #8a6a1f;
    --chase:     #79b0da;
    --sight:     #b98cc4;
    --panel:     #0a1927;
    --edge:      #1d3348;
    --now:       #ffffff;
    --focus:     #ff7043;   /* places belonging to the chapter you are on */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-weight: 600; margin: 0; }

  .wrap { display: flex; flex-direction: column; height: 100vh; }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    padding: 12px 20px; border-bottom: 1px solid var(--edge);
    background: var(--panel);
  }
  .brand h1 { font-size: 19px; letter-spacing: .2px; }
  .brand p  { margin: 2px 0 0; font-size: 12px; color: var(--ink-faint); }

  .gate { display: flex; align-items: center; gap: 12px; margin-left: auto; flex-wrap: wrap; }
  .gate-label { font-size: 12px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .09em; }
  .gate-now {
    min-width: 260px; font-size: 15px; color: var(--brass);
    display: flex; align-items: baseline; gap: 8px;
  }
  .gate-now b { font-weight: 600; }
  .gate-now span { color: var(--ink-dim); font-size: 13px; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  button {
    font: inherit; font-size: 14px; color: var(--ink);
    background: #12283d; border: 1px solid var(--edge); border-radius: 6px;
    padding: 5px 11px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #1a3651; border-color: #2f557a; }
  button:disabled { opacity: .35; cursor: default; }
  button.primary { background: var(--brass-dim); border-color: #b98f2a; color: #fff5dd; }
  button.primary:hover { background: #a37f26; }
  input[type=range] { width: 220px; accent-color: var(--brass); }

  .toggle { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-dim); cursor: pointer; }
  .toggle input { accent-color: var(--brass); width: 15px; height: 15px; }

  .tally { display: flex; gap: 22px; }
  .tally div { text-align: right; }
  .tally .n { font-size: 20px; color: var(--brass); font-variant-numeric: tabular-nums; }
  .tally .k { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .08em; }

  /* ---------- body ---------- */
  main { display: flex; flex: 1; min-height: 0; }

  aside {
    width: 230px; flex: none; overflow-y: auto; padding: 10px 0 30px;
    border-right: 1px solid var(--edge); background: var(--ocean-2);
  }
  .part-head {
    padding: 14px 16px 6px; font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .ch {
    display: flex; align-items: baseline; gap: 8px; width: 100%;
    padding: 5px 16px; font-size: 13.5px; color: var(--ink-dim);
    background: none; border: 0; border-radius: 0; text-align: left; cursor: pointer;
  }
  .ch:hover { background: #10283e; color: var(--ink); }
  .ch .num { font-size: 11px; color: var(--ink-faint); width: 20px; flex: none; font-variant-numeric: tabular-nums; }
  .ch .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brass); flex: none; }
  .ch .dot.empty { background: none; border: 1px solid var(--ink-faint); }
  /* chapters ahead of where you have read: dimmed as "not yet", still clickable */
  .ch.beyond { opacity: .4; }
  .ch.beyond:hover { opacity: .75; }
  .ch.sel { background: #16324b; color: var(--ink); box-shadow: inset 3px 0 0 var(--brass); }
  .ch.here { color: var(--brass); }

  .map-col { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--ocean); }
  .map-tools {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px;
    border-bottom: 1px solid var(--edge); font-size: 12px; color: var(--ink-faint);
  }
  /* the hint gives way before the legend does, so the checkboxes stay on one line */
  .map-tools .hint { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .map-tools .legend { display: flex; gap: 13px; margin-left: auto; flex: none; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .lg {
    display: flex; align-items: center; gap: 5px; cursor: pointer;
    user-select: none; color: var(--ink-dim); white-space: nowrap;
  }
  .lg:hover { color: var(--ink); }
  .lg input { accent-color: var(--brass); width: 13px; height: 13px; margin: 0; cursor: pointer; }
  .lg:has(input:not(:checked)) { color: var(--ink-faint); }
  .lg:has(input:not(:checked)) i { opacity: .3; }
  /* plain keys, not toggles: they explain a marker style rather than switch a layer */
  .key { display: flex; align-items: center; gap: 5px; white-space: nowrap; color: var(--ink-faint); }
  svg { flex: 1; width: 100%; min-height: 0; display: block; touch-action: none; cursor: grab; }
  svg.dragging { cursor: grabbing; }
  /* grabbing the map must not start a text selection - without this, dragging
     highlights the place labels and the drag dies as a selection instead */
  svg, svg text {
    user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;
  }

  .detail {
    width: 310px; flex: none; overflow-y: auto; padding: 18px 18px 40px;
    border-left: 1px solid var(--edge); background: var(--panel);
  }
  .detail .eyebrow { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
  .detail h2 { font-size: 21px; margin: 6px 0 2px; line-height: 1.25; }
  .detail .sub { font-size: 14px; color: var(--brass); margin-bottom: 14px; }
  .meta-row { display: flex; gap: 8px; font-size: 13px; padding: 5px 0; border-top: 1px solid var(--edge); }
  .meta-row .k { color: var(--ink-faint); width: 74px; flex: none; }
  .meta-row .v { color: var(--ink-dim); }
  .note { margin: 14px 0 0; font-size: 14px; color: var(--ink-dim); }
  blockquote {
    margin: 16px 0 0; padding: 10px 0 10px 14px;
    border-left: 2px solid var(--brass-dim);
    font-size: 14.5px; font-style: italic; color: #cfe0ee;
  }
  blockquote cite { display: block; margin-top: 7px; font-size: 11.5px; font-style: normal; color: var(--ink-faint); }
  .tag {
    display: inline-block; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 3px; border: 1px solid; margin-right: 5px;
  }
  .tag.fic  { color: #d6a8e4; border-color: #6b4478; }
  .tag.inf  { color: #9fb6c9; border-color: #33506b; }
  .empty-state { color: var(--ink-faint); font-size: 14px; }

  @media (max-width: 900px) {
    main { flex-direction: column; }
    aside, .detail { width: 100%; max-height: 220px; border: 0; border-top: 1px solid var(--edge); }
    .map-col { min-height: 340px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>The Voyage of the <em>Nautilus</em></h1>
      <p>Twenty Thousand Leagues Under the Seas &middot; 8 Nov 1867 &ndash; June 1868</p>
    </div>

    <div class="tally">
      <div><div class="n" id="tally-day">&mdash;</div><div class="k">Day</div></div>
      <div><div class="n" id="tally-lg">&mdash;</div><div class="k">Leagues</div></div>
    </div>

    <div class="gate">
      <div>
        <div class="gate-label">We&rsquo;ve read up to</div>
        <div class="gate-now"><b id="gate-title">&mdash;</b><span id="gate-ref"></span></div>
      </div>
      <div class="stepper">
        <button id="prev" title="Back one chapter">&larr;</button>
        <input type="range" id="slider" min="1" max="47" value="1">
        <button id="next" title="Forward one chapter">&rarr;</button>
      </div>
      <button id="play" class="primary">&#9654; Replay</button>
      <label class="toggle"><input type="checkbox" id="reveal"> Show whole voyage</label>
    </div>
  </header>

  <main>
    <aside id="chapters"></aside>

    <div class="map-col">
      <div class="map-tools">
        <button id="zin">+</button><button id="zout">&minus;</button><button id="zreset">Reset</button>
        <span class="hint">drag to pan &mdash; the map wraps round &middot; scroll to zoom</span>
        <div class="legend">
          <label class="lg"><input type="checkbox" data-layer="sighting"><i style="background:var(--sight)"></i>Early sightings</label>
          <label class="lg"><input type="checkbox" data-layer="abraham_lincoln"><i style="background:var(--chase)"></i>The chase</label>
          <label class="lg"><input type="checkbox" data-layer="nautilus"><i style="background:var(--brass)"></i>Nautilus</label>
          <span class="key"><i style="background:var(--focus)"></i>This chapter</span>
          <span class="key"><i style="background:none;border:1px dashed currentColor"></i>Invented place</span>
        </div>
      </div>
      <svg id="map" preserveAspectRatio="xMidYMid meet"></svg>
    </div>

    <div class="detail" id="detail"></div>
  </main>
</div>

<script>
const DATA = {"meta":{"voyageStart":"1867-11-08","source":"Jules Verne, Twenty Thousand Leagues Under the Seas, tr. F. P. Walter (PG #2488)","totalLeagues":20000,"generated":"2026-08-12"},"chapters":[{"ordinal":1,"part":1,"chapter":1,"title":"A Runaway Reef"},{"ordinal":2,"part":1,"chapter":2,"title":"The Pros and Cons"},{"ordinal":3,"part":1,"chapter":3,"title":"As Master Wishes"},{"ordinal":4,"part":1,"chapter":4,"title":"Ned Land"},{"ordinal":5,"part":1,"chapter":5,"title":"At Random!"},{"ordinal":6,"part":1,"chapter":6,"title":"At Full Steam"},{"ordinal":7,"part":1,"chapter":7,"title":"A Whale of Unknown Species"},{"ordinal":8,"part":1,"chapter":8,"title":"“Mobilis in Mobili”"},{"ordinal":9,"part":1,"chapter":9,"title":"The Tantrums of Ned Land"},{"ordinal":10,"part":1,"chapter":10,"title":"The Man of the Waters"},{"ordinal":11,"part":1,"chapter":11,"title":"The Nautilus"},{"ordinal":12,"part":1,"chapter":12,"title":"Everything through Electricity"},{"ordinal":13,"part":1,"chapter":13,"title":"Some Figures"},{"ordinal":14,"part":1,"chapter":14,"title":"The Black Current"},{"ordinal":15,"part":1,"chapter":15,"title":"An Invitation in Writing"},{"ordinal":16,"part":1,"chapter":16,"title":"Strolling the Plains"},{"ordinal":17,"part":1,"chapter":17,"title":"An Underwater Forest"},{"ordinal":18,"part":1,"chapter":18,"title":"Four Thousand Leagues Under the Pacific"},{"ordinal":19,"part":1,"chapter":19,"title":"Vanikoro"},{"ordinal":20,"part":1,"chapter":20,"title":"The Torres Strait"},{"ordinal":21,"part":1,"chapter":21,"title":"Some Days Ashore"},{"ordinal":22,"part":1,"chapter":22,"title":"The Lightning Bolts of Captain Nemo"},{"ordinal":23,"part":1,"chapter":23,"title":"“Aegri Somnia”*"},{"ordinal":24,"part":1,"chapter":24,"title":"The Coral Realm"},{"ordinal":25,"part":2,"chapter":1,"title":"The Indian Ocean"},{"ordinal":26,"part":2,"chapter":2,"title":"A New Proposition from Captain Nemo"},{"ordinal":27,"part":2,"chapter":3,"title":"A Pearl Worth Ten Million"},{"ordinal":28,"part":2,"chapter":4,"title":"The Red Sea"},{"ordinal":29,"part":2,"chapter":5,"title":"Arabian Tunnel"},{"ordinal":30,"part":2,"chapter":6,"title":"The Greek Islands"},{"ordinal":31,"part":2,"chapter":7,"title":"The Mediterranean in Forty-Eight Hours"},{"ordinal":32,"part":2,"chapter":8,"title":"The Bay of Vigo"},{"ordinal":33,"part":2,"chapter":9,"title":"A Lost Continent"},{"ordinal":34,"part":2,"chapter":10,"title":"The Underwater Coalfields"},{"ordinal":35,"part":2,"chapter":11,"title":"The Sargasso Sea"},{"ordinal":36,"part":2,"chapter":12,"title":"Sperm Whales and Baleen Whales"},{"ordinal":37,"part":2,"chapter":13,"title":"The Ice Bank"},{"ordinal":38,"part":2,"chapter":14,"title":"The South Pole"},{"ordinal":39,"part":2,"chapter":15,"title":"Accident or Incident?"},{"ordinal":40,"part":2,"chapter":16,"title":"Shortage of Air"},{"ordinal":41,"part":2,"chapter":17,"title":"From Cape Horn to the Amazon"},{"ordinal":42,"part":2,"chapter":18,"title":"The Devilfish"},{"ordinal":43,"part":2,"chapter":19,"title":"The Gulf Stream"},{"ordinal":44,"part":2,"chapter":20,"title":"In Latitude 47° 24′ and Longitude 17° 28′"},{"ordinal":45,"part":2,"chapter":21,"title":"A Mass Execution"},{"ordinal":46,"part":2,"chapter":22,"title":"The Last Words of Captain Nemo"},{"ordinal":47,"part":2,"chapter":23,"title":"Conclusion"}],"points":[{"id":"governor-higginson","name":"Off eastern Australia","kidName":"The very first sighting","lat":-25,"lon":154,"date":"1866-07-20","dateCertainty":"explicit","day":-475,"ordinal":1,"part":1,"chapter":1,"chapterTitle":"A Runaway Reef","leg":"sighting","placeKind":"real","leagueMark":null,"note":"The steamer Governor Higginson meets the 'monster' five miles off Australia. This is two years before the Nautilus voyage, and it is another ship's report, not Aronnax's position.","quote":"In essence, on July 20, 1866, the steamer Governor Higginson, from the Calcutta & Burnach Steam Navigation Co., encountered this moving mass five miles off the eastern shores of Australia.","sourceLine":356},{"id":"helvetia-shannon","name":"Mid-Atlantic","kidName":"Two ships see it at once","lat":42.25,"lon":-60.583,"date":"1866-08-01","dateCertainty":"inferred","day":-463,"ordinal":1,"part":1,"chapter":1,"chapterTitle":"A Runaway Reef","leg":"sighting","placeKind":"real","leagueMark":null,"note":"The Helvetia and the Shannon signal each other that they have both seen it. Verne gives the position but not the date; 'fifteen days later' places it around early August 1866.","quote":"United States and Europe, respectively signaled each other that the monster had been sighted in latitude 42 degrees 15′ north and longitude 60 degrees 35′ west of the meridian of Greenwich.","sourceLine":381},{"id":"moravian","name":"Near the Bahamas","kidName":"The Moravian strikes something","lat":27.5,"lon":-72.25,"date":"1867-03-05","dateCertainty":"explicit","day":-247,"ordinal":1,"part":1,"chapter":1,"chapterTitle":"A Runaway Reef","leg":"sighting","placeKind":"real","leagueMark":null,"note":"Hemisphere inferred: the text gives bare '27 degrees 30' and 72 degrees 15'' with no N/S/E/W. The Moravian was a Montreal Ocean Co. ship on the North Atlantic run, which fixes it as north and west.","quote":"On March 5, 1867, the Moravian from the Montreal Ocean Co., lying during the night in latitude 27 degrees 30′ and longitude 72 degrees 15′, ran its starboard quarter afoul of a rock marked on no charts of these waterways. Under the combined efforts of wind and 400-horsepower steam, it was traveling at a speed of thirteen knots.","sourceLine":456},{"id":"scotia","name":"West of Ireland","kidName":"A hole punched in the Scotia","lat":45.617,"lon":-15.2,"date":"1867-04-13","dateCertainty":"explicit","day":-208,"ordinal":1,"part":1,"chapter":1,"chapterTitle":"A Runaway Reef","leg":"sighting","placeKind":"real","leagueMark":null,"note":"Verne writes longitude BEFORE latitude here, and gives no hemisphere for either. The Scotia was a Cunard liner bound for Liverpool, which fixes it as north and west. This is the damage that finally launches the expedition.","quote":"On April 13, 1867, with a smooth sea and a moderate breeze, the Scotia lay in longitude 15 degrees 12′ and latitude 45 degrees 37′. It was traveling at a speed of 13.43 knots under the thrust of its 1,000-horsepower engines. Its paddle wheels were churning the sea with perfect steadiness.","sourceLine":510},{"id":"brooklyn-departure","name":"Brooklyn, New York","kidName":"The chase begins","lat":40.7,"lon":-74,"date":"1867-06-04","dateCertainty":"inferred","day":-156,"ordinal":3,"part":1,"chapter":3,"chapterTitle":"As Master Wishes","leg":"abraham_lincoln","placeKind":"real","leagueMark":null,"note":"The frigate Abraham Lincoln casts off with Aronnax, Conseil and Ned Land aboard. Verne never dates the departure; chapter 4 calls 25 June 'three weeks after our departure', which places it in the first days of June.","quote":"Just then Commander Farragut was giving orders to cast off the last moorings holding the Abraham Lincoln to its Brooklyn pier. And so if I’d been delayed by a quarter of an hour or even less, the frigate would have gone without me, and I would have missed out on this unearthly, extraordinary, and inconceivable expedition, whose true story might well meet with some skepticism.","sourceLine":1004},{"id":"cabo-blanco","name":"Cabo Blanco, Patagonia","kidName":"Down the coast of South America","lat":-47.2,"lon":-65.75,"date":"1867-06-25","dateCertainty":"explicit","day":-135,"ordinal":4,"part":1,"chapter":4,"chapterTitle":"Ned Land","leg":"abraham_lincoln","placeKind":"real","leagueMark":null,"note":null,"quote":"During the magnificent evening of June 25—in other words, three weeks after our departure—the frigate lay abreast of Cabo Blanco, thirty miles to leeward of the coast of Patagonia. We had crossed the Tropic of Capricorn, and the Strait of Magellan opened less than 700 miles to the south.","sourceLine":1160},{"id":"falkland-islands","name":"Falkland Islands","kidName":"Meeting the whaling fleet","lat":-51.7,"lon":-59,"date":"1867-06-30","dateCertainty":"explicit","day":-130,"ordinal":5,"part":1,"chapter":5,"chapterTitle":"At Random!","leg":"abraham_lincoln","placeKind":"real","leagueMark":null,"note":null,"quote":"Off the Falkland Islands on June 30, the frigate came in contact with a fleet of American whalers, and we learned that they hadn’t seen the narwhale. But one of them, the captain of the Monroe, knew that Ned Land had shipped aboard the Abraham Lincoln and asked his help in hunting a baleen whale that was in sight.","sourceLine":1360},{"id":"strait-of-magellan","name":"Strait of Magellan","kidName":"Too narrow for a monster","lat":-52.33,"lon":-68.4,"date":"1867-07-03","dateCertainty":"explicit","day":-127,"ordinal":5,"part":1,"chapter":5,"chapterTitle":"At Random!","leg":"abraham_lincoln","placeKind":"real","leagueMark":null,"note":"Farragut will not risk the strait and goes the long way round instead. Ned Land jokes the monster could never fit through anyway, because 'he's too big for it!'","quote":"The frigate sailed along the east coast of South America with prodigious speed. By July 3 we were at the entrance to the Strait of Magellan, abreast of Cabo de las Virgenes. But Commander Farragut was unwilling to attempt this tortuous passageway and maneuvered instead to double Cape Horn. The crew sided with him unanimously.","sourceLine":1374},{"id":"cape-horn","name":"Cape Horn","kidName":"Round the bottom of the world","lat":-55.98,"lon":-67.27,"date":"1867-07-06","dateCertainty":"explicit","day":-124,"ordinal":5,"part":1,"chapter":5,"chapterTitle":"At Random!","leg":"abraham_lincoln","placeKind":"real","leagueMark":null,"note":null,"quote":"Near three o’clock in the afternoon on July 6, fifteen miles south of shore, the Abraham Lincoln doubled that solitary islet at the tip of the South American continent, that stray rock Dutch seamen had named Cape Horn after their hometown of Hoorn. Our course was set for the northwest, and the next day our frigate’s propeller finally churned the waters of the Pacific. “Open your eyes!","sourceLine":1384},{"id":"capricorn-105","name":"Tropic of Capricorn","kidName":"Out into the wide Pacific","lat":-23.44,"lon":-105,"date":"1867-07-20","dateCertainty":"explicit","day":-110,"ordinal":5,"part":1,"chapter":5,"chapterTitle":"At Random!","leg":"abraham_lincoln","placeKind":"real","leagueMark":null,"note":"Longitude given bare as '105 degrees'; west, since the frigate has just rounded Cape Horn and is standing out into the South Pacific.","quote":"On July 20 we cut the Tropic of Capricorn at longitude 105 degrees, and by the 27th of the same month, we had cleared the equator on the 110th meridian. These bearings determined, the frigate took a more decisive westward heading and tackled the seas of the central Pacific.","sourceLine":1455},{"id":"equator-110","name":"Crossing the equator","kidName":"Crossing the line","lat":0,"lon":-110,"date":"1867-07-27","dateCertainty":"explicit","day":-103,"ordinal":5,"part":1,"chapter":5,"chapterTitle":"At Random!","leg":"abraham_lincoln","placeKind":"real","leagueMark":null,"note":"Longitude west, inferred from the run between the previous and next fixes.","quote":"On July 20 we cut the Tropic of Capricorn at longitude 105 degrees, and by the 27th of the same month, we had cleared the equator on the 110th meridian. These bearings determined, the frigate took a more decisive westward heading and tackled the seas of the central Pacific.","sourceLine":1456},{"id":"cancer-132","name":"Tropic of Cancer","kidName":"Turning for the seas of China","lat":23.44,"lon":-132,"date":"1867-09-15","dateCertainty":"inferred","day":-53,"ordinal":5,"part":1,"chapter":5,"chapterTitle":"At Random!","leg":"abraham_lincoln","placeKind":"real","leagueMark":null,"note":"Verne gives no date for this crossing, only that it came after passing the Tuamotus, Marquesas and Hawaii. Placed mid-September between the dated fixes on either side.","quote":"Commander Farragut felt, and with good reason, that it was best to stay in deep waters and keep his distance from continents or islands, whose neighborhoods the animal always seemed to avoid—“No doubt,” our bosun said, “because there isn’t enough water for him!” So the frigate kept well out when passing the Tuamotu, Marquesas, and Hawaiian Islands, then cut the Tropic of Cancer at longitude 132 degrees and headed for…","sourceLine":1466},{"id":"japan-station","name":"Off Japan","kidName":"Three days left to find it","lat":31.25,"lon":136.7,"date":"1867-11-02","dateCertainty":"explicit","day":-5,"ordinal":5,"part":1,"chapter":5,"chapterTitle":"At Random!","leg":"abraham_lincoln","placeKind":"real","leagueMark":null,"note":"Farragut promises the crew he will turn for home in three days if nothing is found. The deadline expires at noon on 5 November.","quote":"By then the frigate lay in latitude 31 degrees 15′ north and longitude 136 degrees 42′ east. The shores of Japan were less than 200 miles to our leeward. Night was coming on. Eight o’clock had just struck. Huge clouds covered the moon’s disk, then in its first quarter.","sourceLine":1543},{"id":"the-collision","name":"The encounter","kidName":"Thrown into the sea!","lat":31.5,"lon":136.5,"date":"1867-11-06","dateCertainty":"inferred","day":-1,"ordinal":7,"part":1,"chapter":7,"chapterTitle":"A Whale of Unknown Species","leg":"abraham_lincoln","placeKind":"real","leagueMark":null,"note":"The frigate finds the creature at last and is struck; Aronnax goes over the side, Conseil dives in after him, and they find Ned Land already standing on a steel hull. Verne dates the encounter 6 November in the previous chapter and runs it through the night without repeating the date.","quote":"A few moments later, eight strapping fellows appeared silently, their faces like masks, and dragged us down into their fearsome machine.","sourceLine":2338},{"id":"voyage-begins","name":"300 miles from Japan","kidName":"Day one aboard the Nautilus","lat":30.117,"lon":137.25,"date":"1867-11-08","dateCertainty":"explicit","day":1,"ordinal":14,"part":1,"chapter":14,"chapterTitle":"The Black Current","leg":"nautilus","placeKind":"real","leagueMark":0,"note":"Nemo fixes the position and declares the voyage begun. Careful: he says '137 degrees 15' west of the meridian of Paris', which would put them in the mid-Pacific, yet in the same breath says 'about 300 miles from the shores of Japan'. The numbers work as EAST; the 'west' is Verne's slip. Placed where the story says they are.","quote":"I bowed, and the commander went on: “We’re in longitude 137 degrees 15′ west of the meridian of Paris, and latitude 30 degrees 7′ north, in other words, about 300 miles from the shores of Japan. At noon on this day of November 8, we hereby begin our voyage of exploration under the waters.” “May God be with us!”","sourceLine":4384},{"id":"crespo-island","name":"Crespo Island","kidName":"Hunting in an underwater forest","lat":32.667,"lon":-167.833,"date":"1867-11-17","dateCertainty":"explicit","day":10,"ordinal":15,"part":1,"chapter":15,"chapterTitle":"An Invitation in Writing","leg":"nautilus","placeKind":"fictional","leagueMark":null,"note":"Nemo invites them to hunt in the drowned forests of Crespo. Aronnax looks the island up on the map and finds an islet reported in 1801 - but no such island exists. It is one of Verne s inventions. The walk itself follows in the next two chapters.","quote":"I consulted the world map; and in latitude 32 degrees 40′ north and longitude 167 degrees 50′ west, I found an islet that had been discovered in 1801 by Captain Crespo, which old Spanish charts called Rocca de la Plata, in other words, “Silver Rock.”","sourceLine":4924},{"id":"tropic-cancer-172","name":"Tropic of Cancer","kidName":"Southward across the Pacific","lat":23.44,"lon":-172,"date":"1867-11-26","dateCertainty":"explicit","day":19,"ordinal":18,"part":1,"chapter":18,"chapterTitle":"Four Thousand Leagues Under the Pacific","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"Longitude given bare as '172 degrees'; read as west, since it falls between Crespo Island and the sighting of Hawaii the next day.","quote":"On November 26, at three o’clock in the morning, the Nautilus cleared the Tropic of Cancer at longitude 172 degrees. On the 27th it passed in sight of the Hawaiian Islands, where the famous Captain Cook met his death on February 14, 1779.","sourceLine":5866},{"id":"hawaii","name":"Hawaiian Islands","kidName":"Where Captain Cook died","lat":19.6,"lon":-155.5,"date":"1867-11-27","dateCertainty":"explicit","day":20,"ordinal":18,"part":1,"chapter":18,"chapterTitle":"Four Thousand Leagues Under the Pacific","leg":"nautilus","placeKind":"real","leagueMark":4860,"note":null,"quote":"On November 26, at three o’clock in the morning, the Nautilus cleared the Tropic of Cancer at longitude 172 degrees. On the 27th it passed in sight of the Hawaiian Islands, where the famous Captain Cook met his death on February 14, 1779. By then we had fared 4,860 leagues from our starting point.","sourceLine":5869},{"id":"equator-142","name":"Crossing the equator","kidName":"Over the line again","lat":0,"lon":-142,"date":"1867-12-01","dateCertainty":"explicit","day":24,"ordinal":18,"part":1,"chapter":18,"chapterTitle":"Four Thousand Leagues Under the Pacific","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"Longitude west, confirmed by the run from Hawaii to the Marquesas on either side of it.","quote":"The Nautilus kept to its southeasterly heading. On December 1 it cut the equator at longitude 142 degrees, and on the 4th of the same month, after a quick crossing marked by no incident, we raised the Marquesas Islands. Three miles off, in latitude 8 degrees 57′ south and longitude 139 degrees 32′ west, I spotted Martin Point on Nuku Hiva, chief member of this island group that belongs to France.","sourceLine":5881},{"id":"marquesas","name":"Marquesas Islands","kidName":"Green islands in the distance","lat":-8.95,"lon":-139.533,"date":"1867-12-04","dateCertainty":"explicit","day":27,"ordinal":18,"part":1,"chapter":18,"chapterTitle":"Four Thousand Leagues Under the Pacific","leg":"nautilus","placeKind":"real","leagueMark":null,"note":null,"quote":"On December 1 it cut the equator at longitude 142 degrees, and on the 4th of the same month, after a quick crossing marked by no incident, we raised the Marquesas Islands. Three miles off, in latitude 8 degrees 57′ south and longitude 139 degrees 32′ west, I spotted Martin Point on Nuku Hiva, chief member of this island group that belongs to France.","sourceLine":5884},{"id":"tuamotus","name":"Tuamotu Islands","kidName":"The dangerous islands","lat":-18.5,"lon":-136.4,"date":"1867-12-11","dateCertainty":"explicit","day":34,"ordinal":19,"part":1,"chapter":19,"chapterTitle":"Vanikoro","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"Bougainville's 'dangerous group' - a maze of low coral atolls. The Nautilus touches the Tropic of Capricorn here and changes course.","quote":"Near evening Reao Island melted into the distance, and the Nautilus noticeably changed course. After touching the Tropic of Capricorn at longitude 135 degrees, it headed west-northwest, going back up the whole intertropical zone.","sourceLine":6091},{"id":"society-islands","name":"Society Islands","kidName":"Tahiti slips past to the west","lat":-17.6,"lon":-149.6,"date":"1867-12-15","dateCertainty":"explicit","day":38,"ordinal":19,"part":1,"chapter":19,"chapterTitle":"Vanikoro","leg":"nautilus","placeKind":"real","leagueMark":null,"note":null,"quote":"By December 15 we had left the alluring Society Islands in the west, likewise elegant Tahiti, queen of the Pacific. In the morning I spotted this island’s lofty summits a few miles to leeward. Its waters supplied excellent fish for the tables on board: mackerel, bonito, albacore, and a few varieties of that sea serpent named the moray eel.","sourceLine":6097},{"id":"tonga-fiji","name":"Fiji Islands","kidName":"Christmas Day at sea","lat":-17.8,"lon":178,"date":"1867-12-25","dateCertainty":"explicit","day":48,"ordinal":19,"part":1,"chapter":19,"chapterTitle":"Vanikoro","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"Christmas passes unmarked aboard - Ned Land misses it badly. The Nautilus threads the island group Verne places between latitude 2 and 6 degrees south.","quote":"On December 25 the Nautilus navigated amid the island group of the New Hebrides, which the Portuguese seafarer Queirós discovered in 1606, which Commander Bougainville explored in 1768, and to which Captain Cook gave its current name in 1773.","sourceLine":6145},{"id":"vanikoro","name":"Vanikoro","kidName":"The wreck of La Perouse","lat":-16.067,"lon":164.533,"date":"1867-12-26","dateCertainty":"inferred","day":49,"ordinal":19,"part":1,"chapter":19,"chapterTitle":"Vanikoro","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"Nemo shows Aronnax the wreck of La Perouse s expedition, lost in 1788 - a real mystery, solved only forty years later. Verne s fix of 16 deg 4 S is south of the real Vanikoro near 11 deg 40 S. The visit falls between the dated 25 December and the departure on the night of 27-28 December.","quote":"We were facing the island of Vanikoro proper, to which Captain Dumont d’Urville had given the name “Island of the Search”; we lay right in front of the little harbor of Vana, located in latitude 16 degrees 4′ south and longitude 164 degrees 32′ east. Its shores seemed covered with greenery from its beaches to its summits inland, crowned by Mt.","sourceLine":6191},{"id":"coral-sea","name":"Coral Sea","kidName":"5,250 leagues so far","lat":-15,"lon":150,"date":"1868-01-02","dateCertainty":"explicit","day":56,"ordinal":20,"part":1,"chapter":20,"chapterTitle":"The Torres Strait","leg":"nautilus","placeKind":"real","leagueMark":5250,"note":null,"quote":"By January 2 we had fared 11,340 miles, hence 5,250 leagues, from our starting point in the seas of Japan. Before the Nautilus’s spur there stretched the dangerous waterways of the Coral Sea, off the northeast coast of Australia. Our boat cruised along a few miles away from that daunting shoal where Captain Cook’s ships wellnigh miscarried on June 10, 1770.","sourceLine":6469},{"id":"torres-strait","name":"Torres Strait","kidName":"Stuck fast on a reef","lat":-9.9,"lon":142.6,"date":"1868-01-04","dateCertainty":"explicit","day":58,"ordinal":20,"part":1,"chapter":20,"chapterTitle":"The Torres Strait","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"The Nautilus runs hard aground on a coral reef and cannot move. Nemo is unbothered: he will simply wait for the spring tide on the 9th to lift her off.","quote":"On January 4, two days after crossing the Coral Sea, we raised the coast of Papua. On this occasion Captain Nemo told me that he intended to reach the Indian Ocean via the Torres Strait. This was the extent of his remarks. Ned saw with pleasure that this course would bring us, once again, closer to European seas.","sourceLine":6501},{"id":"gilboa-island","name":"Gueboroa Island, Papua","kidName":"Ashore - and chased by islanders","lat":-9.5,"lon":142.9,"date":"1868-01-06","dateCertainty":"explicit","day":60,"ordinal":21,"part":1,"chapter":21,"chapterTitle":"Some Days Ashore","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"Marooned by the tide, the three go ashore for fresh fruit and roast bird - the only time they set foot on land in months. Hundreds of Papuans drive them back to the ship.","quote":"The next day, January 6: nothing new on board. Not a sound inside, not a sign of life. The skiff stayed alongside in the same place we had left it. We decided to return to Gueboroa Island. Ned Land hoped for better luck in his hunting than on the day before, and he wanted to visit a different part of the forest.","sourceLine":7010},{"id":"electrified-rail","name":"Torres Strait","kidName":"The captain's electric fence","lat":-9.7,"lon":142.8,"date":"1868-01-08","dateCertainty":"explicit","day":62,"ordinal":22,"part":1,"chapter":22,"chapterTitle":"The Lightning Bolts of Captain Nemo","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"The islanders try to board through the open hatch and are flung back by a shock - Nemo has electrified the handrail. The tide lifts the Nautilus free the next day.","quote":"At six o’clock in the morning, January 8, I climbed onto the platform. The morning shadows were lifting. The island was soon on view through the dissolving mists, first its beaches, then its summits.","sourceLine":7389},{"id":"cape-wessel","name":"Cape Wessel, Australia","kidName":"Along the top of Australia","lat":-11,"lon":136.75,"date":"1868-01-11","dateCertainty":"explicit","day":65,"ordinal":23,"part":1,"chapter":23,"chapterTitle":"“Aegri Somnia”*","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"Verne says Cape Wessel lies at 'latitude 10 degrees north' - it is 11 degrees SOUTH, at the top of the Gulf of Carpentaria. The place name is unambiguous, so the point is drawn at the real cape and Verne's 'north' is an error.","quote":"We were traveling due west and on January 11 we doubled Cape Wessel, located in longitude 135 degrees and latitude 10 degrees north, the western tip of the Gulf of Carpentaria. Reefs were still numerous but more widely scattered and were fixed on the chart with the greatest accuracy.","sourceLine":7803},{"id":"timor","name":"Timor Sea","kidName":"Past the island of Timor","lat":-9.5,"lon":122,"date":"1868-01-13","dateCertainty":"explicit","day":67,"ordinal":23,"part":1,"chapter":23,"chapterTitle":"“Aegri Somnia”*","leg":"nautilus","placeKind":"real","leagueMark":null,"note":null,"quote":"On January 13, arriving in the Timor Sea, Captain Nemo raised the island of that name at longitude 122 degrees. This island, whose surface area measures 1,625 square leagues, is governed by rajahs. These aristocrats deem themselves the sons of crocodiles, in other words, descendants with the most exalted origins to which a human being can lay claim.","sourceLine":7811},{"id":"indian-ocean-jan18","name":"Indian Ocean","kidName":"A storm and a strange sleep","lat":-15,"lon":105,"date":"1868-01-18","dateCertainty":"explicit","day":72,"ordinal":23,"part":1,"chapter":23,"chapterTitle":"“Aegri Somnia”*","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"Both figures given bare; east and south, from the run between Timor and Keeling Island. That night the three are drugged and shut in - and Aronnax wakes to a wounded man aboard.","quote":"On January 18 the Nautilus lay in longitude 105 degrees and latitude 15 degrees south. The weather was threatening, the sea rough and billowy. The wind was blowing a strong gust from the east. The barometer, which had been falling for some days, forecast an approaching struggle of the elements.","sourceLine":7988},{"id":"coral-cemetery","name":"The coral cemetery","kidName":"A graveyard made of coral","lat":-16,"lon":100,"date":"1868-01-20","dateCertainty":"inferred","day":74,"ordinal":24,"part":1,"chapter":24,"chapterTitle":"The Coral Realm","leg":"nautilus","placeKind":"fictional","leagueMark":null,"note":"The crewman who died is buried in a forest of coral on the sea floor, where the coral will slowly grow over the graves. Verne gives no position; placed on the run between the 18 January fix and the Indian Ocean chapter.","quote":"And, contrary to custom, it executed such a maneuver several times during that day of January 19. The chief officer would then climb onto the platform, and his usual phrase would ring through the ship’s interior. As for Captain Nemo, he didn’t appear.","sourceLine":8180},{"id":"indian-ocean-jan21","name":"Indian Ocean","kidName":"6,000 leagues covered","lat":-12,"lon":98,"date":"1868-01-21","dateCertainty":"explicit","day":75,"ordinal":25,"part":2,"chapter":1,"chapterTitle":"The Indian Ocean","leg":"nautilus","placeKind":"real","leagueMark":6000,"note":null,"quote":"I want to see what no man has seen yet, even if I must pay for this insatiable curiosity with my life! What are my discoveries to date? Nothing, relatively speaking—since so far we’ve covered only 6,000 leagues across the Pacific!","sourceLine":8569},{"id":"keeling-island","name":"Keeling Island","kidName":"A coral island of palms","lat":-12.083,"lon":94.55,"date":"1868-01-24","dateCertainty":"explicit","day":78,"ordinal":25,"part":2,"chapter":1,"chapterTitle":"The Indian Ocean","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"Longitude given bare as '94 degrees 33'', read as east. The real Cocos (Keeling) Islands sit a little further east, near 96 deg 50'.","quote":"On the morning of the 24th, in latitude 12 degrees 5′ south and longitude 94 degrees 33′, we raised Keeling Island, a madreporic upheaving planted with magnificent coconut trees, which had been visited by Mr.","sourceLine":8723},{"id":"bay-of-bengal","name":"Bay of Bengal","kidName":"Sharks at the river mouths","lat":15,"lon":85,"date":"1868-01-27","dateCertainty":"explicit","day":81,"ordinal":25,"part":2,"chapter":1,"chapterTitle":"The Indian Ocean","leg":"nautilus","placeKind":"real","leagueMark":null,"note":null,"quote":"On January 27, at the entrance to the huge Bay of Bengal, we repeatedly encountered a gruesome sight: human corpses floating on the surface of the waves! Carried by the Ganges to the high seas, these were deceased Indian villagers who hadn’t been fully devoured by vultures, the only morticians in these parts.","sourceLine":8854},{"id":"ceylon","name":"Ceylon","kidName":"The pearl banks of Ceylon","lat":9.067,"lon":79.7,"date":"1868-01-28","dateCertainty":"explicit","day":82,"ordinal":26,"part":2,"chapter":2,"chapterTitle":"A New Proposition from Captain Nemo","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"Nemo proposes an excursion to the pearl banks of Manaar - and mentions, casually, that there will be sharks.","quote":"ON JANUARY 28, in latitude 9 degrees 4′ north, when the Nautilus returned at noon to the surface of the sea, it lay in sight of land some eight miles to the west. Right off, I observed a cluster of mountains about 2,000 feet high, whose shapes were very whimsically sculpted.","sourceLine":8912},{"id":"pearl-fishery","name":"Manaar pearl banks","kidName":"The diver and the shark","lat":8.9,"lon":79.5,"date":"1868-01-29","dateCertainty":"inferred","day":83,"ordinal":27,"part":2,"chapter":3,"chapterTitle":"A Pearl Worth Ten Million","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"A pearl diver is attacked by a shark; Nemo throws himself at it with a dagger and Ned Land s harpoon finishes it. Nemo gives the rescued man a bag of pearls. Verne dates the return in the next chapter, on 29 January.","quote":"When I shared these impressions with him, he answered me in a tone touched with emotion: “That Indian, professor, lives in the land of the oppressed, and I am to this day, and will be until my last breath, a native of that same land!”","sourceLine":9830},{"id":"laccadives","name":"Laccadive Islands","kidName":"7,500 leagues covered","lat":11,"lon":72,"date":"1868-01-30","dateCertainty":"explicit","day":84,"ordinal":28,"part":2,"chapter":4,"chapterTitle":"The Red Sea","leg":"nautilus","placeKind":"real","leagueMark":7500,"note":"Verne places the group 'between longitude 50 degrees 72' and 69 degrees east' - 72 minutes is impossible, since there are only 60 in a degree. A slip in the text; the islands themselves lie near 72 degrees east.","quote":"By then we had fared 16,220 miles, or 7,500 leagues, from our starting point in the seas of Japan. The next day, January 30, when the Nautilus rose to the surface of the ocean, there was no more land in sight.","sourceLine":9849},{"id":"gulf-of-oman","name":"Gulf of Oman","kidName":"A dead end - or is it?","lat":24.5,"lon":58.5,"date":"1868-02-03","dateCertainty":"explicit","day":88,"ordinal":28,"part":2,"chapter":4,"chapterTitle":"The Red Sea","leg":"nautilus","placeKind":"real","leagueMark":null,"note":null,"quote":"For four days until February 3, the Nautilus inspected the Gulf of Oman at various speeds and depths. It seemed to be traveling at random, as if hesitating over which course to follow, but it never crossed the Tropic of Cancer.","sourceLine":9919},{"id":"bab-el-mandeb","name":"Strait of Bab el Mandeb","kidName":"The Gate of Tears","lat":12.6,"lon":43.4,"date":"1868-02-07","dateCertainty":"explicit","day":92,"ordinal":28,"part":2,"chapter":4,"chapterTitle":"The Red Sea","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"The narrow gate into the Red Sea. Its name means 'the Gate of Tears'. Ned Land is baffled - the Red Sea is a dead end, so how will they ever get out?","quote":"The next day, February 7, we entered the Strait of Bab el Mandeb, whose name means “Gate of Tears” in the Arabic language. Twenty miles wide, it’s only fifty-two kilometers long, and with the Nautilus launched at full speed, clearing it was the work of barely an hour.","sourceLine":9950},{"id":"red-sea","name":"The Red Sea","kidName":"Why is the Red Sea red?","lat":20,"lon":38.5,"date":"1868-02-09","dateCertainty":"explicit","day":94,"ordinal":28,"part":2,"chapter":4,"chapterTitle":"The Red Sea","leg":"nautilus","placeKind":"real","leagueMark":null,"note":null,"quote":"On February 9 the Nautilus cruised in the widest part of the Red Sea, measuring 190 miles straight across from Suakin on the west coast to Qunfidha on the east coast. At noon that day after our position fix, Captain Nemo climbed onto the platform, where I happened to be.","sourceLine":10091},{"id":"jidda","name":"Jidda, Arabia","kidName":"Lights on the Arab coast","lat":21.5,"lon":39.17,"date":"1868-02-10","dateCertainty":"explicit","day":95,"ordinal":29,"part":2,"chapter":5,"chapterTitle":"Arabian Tunnel","leg":"nautilus","placeKind":"real","leagueMark":null,"note":null,"quote":"The same evening, at latitude 21 degrees 30′ north, the Nautilus was afloat on the surface of the sea and drawing nearer to the Arab coast. I spotted Jidda, an important financial center for Egypt, Syria, Turkey, and the East Indies. I could distinguish with","sourceLine":10385},{"id":"arabian-tunnel","name":"The Arabian Tunnel","kidName":"A secret tunnel under the desert","lat":29,"lon":33,"date":"1868-02-11","dateCertainty":"explicit","day":96,"ordinal":29,"part":2,"chapter":5,"chapterTitle":"Arabian Tunnel","leg":"nautilus","placeKind":"fictional","leagueMark":null,"note":"Nemo's answer to Ned's question: a natural passage under the Isthmus of Suez, from the Red Sea to the Mediterranean, known only to him. He calls it the Arabian Tunnel. It does not exist - and the real Suez Canal opened the year after Verne wrote this.","quote":"The next morning, February 11, the Nautilus’s pantry was enriched by more dainty game. A covey of terns alighted on the Nautilus. They were a species of Sterna nilotica unique to Egypt: beak black, head gray and stippled, eyes surrounded by white dots, back, wings, and tail grayish, belly and throat white, feet red.","sourceLine":10634},{"id":"mediterranean-entry","name":"Off Pelusium, Egypt","kidName":"Out into the Mediterranean","lat":31.5,"lon":32.3,"date":"1868-02-12","dateCertainty":"explicit","day":97,"ordinal":30,"part":2,"chapter":6,"chapterTitle":"The Greek Islands","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"They went in by the Red Sea and came out in the Mediterranean, in a single night.","quote":"AT SUNRISE the next morning, February 12, the Nautilus rose to the surface of the waves. I rushed onto the platform.","sourceLine":10764},{"id":"santorini","name":"Santorini","kidName":"Swimming in boiling water","lat":36.4,"lon":25.4,"date":"1868-02-16","dateCertainty":"explicit","day":101,"ordinal":30,"part":2,"chapter":6,"chapterTitle":"The Greek Islands","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"The Nautilus passes through a sea literally on the boil, where a new volcanic island is being born. The water outside reaches 45 degrees C and the hull glows in the sulphurous murk.","quote":"The next day, February 16, we left this basin, which tallies depths of 3,000 meters between Rhodes and Alexandria, and passing well out from Cerigo Island after doubling Cape Matapan, the Nautilus left the Greek Islands behind.","sourceLine":11254},{"id":"gibraltar","name":"Strait of Gibraltar","kidName":"The whole sea in two days","lat":35.95,"lon":-5.6,"date":"1868-02-18","dateCertainty":"explicit","day":103,"ordinal":31,"part":2,"chapter":7,"chapterTitle":"The Mediterranean in Forty-Eight Hours","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"600 leagues of Mediterranean crossed in about 48 hours - so fast that Aronnax can barely see anything, and Ned Land's escape plan is ruined.","quote":"I estimate that the Nautilus covered a track of some 600 leagues under the waves of this sea, and this voyage was accomplished in just twenty-four hours times two. Departing from the waterways of Greece on the morning of February 16, we cleared the Strait of Gibraltar by sunrise on the 18th.","sourceLine":11282},{"id":"vigo-bay","name":"Bay of Vigo, Spain","kidName":"Where Nemo gets his gold","lat":42.24,"lon":-8.72,"date":"1868-02-18","dateCertainty":"inferred","day":103,"ordinal":32,"part":2,"chapter":8,"chapterTitle":"The Bay of Vigo","leg":"nautilus","placeKind":"real","leagueMark":10000,"note":"The wrecks of the Spanish treasure galleons sunk here in 1702. Aronnax finally understands where Nemo s wealth comes from - and what he does with it: he gives it to peoples fighting for their freedom. Dated by the crossing that ends on 18 February and the morning of the 19th that opens the next chapter.","quote":"The Nautilus broke these waters with the edge of its spur after doing nearly 10,000 leagues in three and a half months, a track longer than a great circle of the earth. Where were we heading now, and what did the future have in store for us? Emerging from the Strait of Gibraltar, the Nautilus took to the high seas.","sourceLine":11663},{"id":"atlantis","name":"Atlantis","kidName":"The ruins of a lost city","lat":33.367,"lon":-16.283,"date":"1868-02-19","dateCertainty":"explicit","day":104,"ordinal":33,"part":2,"chapter":9,"chapterTitle":"A Lost Continent","leg":"nautilus","placeKind":"fictional","leagueMark":null,"note":"By the light of a volcano, Nemo shows Aronnax a drowned city on the sea floor and writes one word on a rock: ATLANTIS. Both figures given bare in the text; north and west, from the position 150 leagues off the nearest coast near Madeira.","quote":"When I consulted the chart an hour later, I saw that the Nautilus’s position was marked at longitude 16 degrees 17′ and latitude 33 degrees 22′, a good 150 leagues from the nearest coast. It wouldn’t do to even dream of escaping, and I’ll let the reader decide how promptly the Canadian threw a tantrum when I ventured to tell him our situation.","sourceLine":12133},{"id":"underwater-coalfields","name":"The undersea coal mine","kidName":"A volcano with a lake inside","lat":33,"lon":-17,"date":"1868-02-20","dateCertainty":"explicit","day":105,"ordinal":34,"part":2,"chapter":10,"chapterTitle":"The Underwater Coalfields","leg":"nautilus","placeKind":"fictional","leagueMark":null,"note":"The Nautilus sails up inside an extinct volcano through an underwater opening, and surfaces in a hidden lake with a beach - where Nemo's crew mine coal to make sodium for the batteries.","quote":"I was so exhausted from the night before, I didn’t get up until eleven o’clock. I dressed quickly. I hurried to find out the Nautilus’s heading. The instruments indicated that it was running southward at a speed of twenty miles per hour and a depth of 100 meters.","sourceLine":12488},{"id":"sargasso-sea","name":"The Sargasso Sea","kidName":"A sea made of seaweed","lat":30,"lon":-45,"date":"1868-02-22","dateCertainty":"explicit","day":107,"ordinal":35,"part":2,"chapter":11,"chapterTitle":"The Sargasso Sea","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"A vast raft of floating weed in the middle of the Atlantic, held in place by the circling currents. Ships have been becalmed in it for weeks.","quote":"We spent the whole day of February 22 in the Sargasso Sea, where fish that dote on marine plants and crustaceans find plenty to eat. The next day the ocean resumed its usual appearance. From this moment on, for nineteen days from February 23 to March 12, the Nautilus stayed in the middle of the Atlantic, hustling us along at a constant speed of 100 leagues every twenty-four hours.","sourceLine":13005},{"id":"south-atlantic-mar13","name":"South Atlantic","kidName":"13,000 leagues - and turning south","lat":-45.617,"lon":-37.883,"date":"1868-03-13","dateCertainty":"explicit","day":127,"ordinal":35,"part":2,"chapter":11,"chapterTitle":"The Sargasso Sea","leg":"nautilus","placeKind":"real","leagueMark":13000,"note":"Nineteen days running south down the middle of the Atlantic. Here the Nautilus dives deeper than any ship has ever sounded.","quote":"By then we had fared nearly 13,000 leagues from our starting point in the Pacific high seas. Our position fix placed us in latitude 45 degrees 37′ south and longitude 37 degrees 53′ west. These were the same waterways where Captain Denham, aboard the Herald, payed out 14,000 meters of sounding line without finding bottom.","sourceLine":13115},{"id":"first-ice","name":"The first ice","kidName":"Icebergs ahead","lat":-55,"lon":-45,"date":"1868-03-14","dateCertainty":"explicit","day":128,"ordinal":37,"part":2,"chapter":13,"chapterTitle":"The Ice Bank","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"Latitude given bare as '55 degrees'; south, from the heading. Where is Nemo taking them? Ned Land has guessed, and cannot believe it.","quote":"On March 14 at latitude 55 degrees, I spotted floating ice, plain pale bits of rubble twenty to twenty-five feet long, which formed reefs over which the sea burst into foam. The Nautilus stayed on the surface of the ocean.","sourceLine":13804},{"id":"antarctic-circle","name":"The Antarctic Circle","kidName":"Past the Antarctic Circle","lat":-66.56,"lon":-55,"date":"1868-03-16","dateCertainty":"explicit","day":130,"ordinal":37,"part":2,"chapter":13,"chapterTitle":"The Ice Bank","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"Going along the 55th meridian. Autumn is closing in down here - in a few weeks the sun will set for six months.","quote":"Going along the 55th meridian, the Nautilus cut the Antarctic Circle on March 16 near eight o’clock in the morning. Ice completely surrounded us and closed off the horizon. Nevertheless, Captain Nemo went from passageway to passageway, always proceeding south. “But where’s he going?”","sourceLine":13873},{"id":"the-ice-bank","name":"The Ice Bank","kidName":"A wall of ice with no way through","lat":-67.65,"lon":-51.5,"date":"1868-03-18","dateCertainty":"explicit","day":132,"ordinal":37,"part":2,"chapter":13,"chapterTitle":"The Ice Bank","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"After twenty attempts the Nautilus is stopped by an unbroken barrier of ice. So Nemo does the one thing no other ship could: he dives underneath it. Longitude read as west, from the 52nd meridian named a few pages later.","quote":"When the sun appeared for an instant near noon, Captain Nemo took a reasonably accurate sight that gave our position as longitude 51 degrees 30′ and latitude 67 degrees 39′ south. This was a position already well along in these Antarctic regions. As for the liquid surface of the sea, there was no longer any semblance of it before our eyes.","sourceLine":13957},{"id":"south-pole","name":"The South Pole","kidName":"Standing at the bottom of the world","lat":-90,"lon":0,"date":"1868-03-21","dateCertainty":"explicit","day":135,"ordinal":38,"part":2,"chapter":14,"chapterTitle":"The South Pole","leg":"nautilus","placeKind":"fictional","leagueMark":null,"note":"Under the ice and up into an open polar sea, to land no one had ever seen. Nemo waits for noon, takes the sun's altitude, and plants a black flag: 'I, Captain Nemo, on this 21st day of March 1868, have reached the South Pole.' In reality the pole sits under two miles of ice, and no one stood there until Amundsen in 1911.","quote":"Well now! In 1868, on this 21st day of March, I myself, Captain Nemo, have reached the South Pole at 90 degrees, and I hereby claim this entire part of the globe, equal to one-sixth of the known continents.” “In the name of which sovereign, captain?” “In my own name, sir!” So saying, Captain Nemo unfurled a black flag bearing a gold “N” on its quartered bunting.","sourceLine":14801},{"id":"trapped-in-ice","name":"Trapped under the ice","kidName":"Sealed in - and the air running out","lat":-70,"lon":-55,"date":"1868-03-22","dateCertainty":"explicit","day":136,"ordinal":39,"part":2,"chapter":15,"chapterTitle":"Accident or Incident?","leg":"nautilus","placeKind":"real","leagueMark":14000,"note":"A capsizing iceberg pins the Nautilus in a sealed pocket of water. The crew cut at the ice from inside while the oxygen runs down, hour by hour. The scariest stretch in the book.","quote":"THE NEXT DAY, March 22, at six o’clock in the morning, preparations for departure began. The last gleams of twilight were melting into night. The cold was brisk. The constellations were glittering with startling intensity.","sourceLine":14824},{"id":"breaking-free","name":"Breaking out","kidName":"Free - and up for air","lat":-65,"lon":-55,"date":"1868-03-28","dateCertainty":"explicit","day":142,"ordinal":40,"part":2,"chapter":16,"chapterTitle":"Shortage of Air","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"The Nautilus smashes up through the last of the ice. Aronnax has nearly suffocated; Ned Land and Conseil give him the last of the breathable air.","quote":"It had to be March 28. The Nautilus was traveling at the frightful speed of forty miles per hour. It was writhing in the waters. Where was Captain Nemo?","sourceLine":15576},{"id":"cape-horn-return","name":"Cape Horn again","kidName":"Back round Cape Horn","lat":-56,"lon":-67,"date":"1868-03-31","dateCertainty":"explicit","day":145,"ordinal":41,"part":2,"chapter":17,"chapterTitle":"From Cape Horn to the Amazon","leg":"nautilus","placeKind":"real","leagueMark":null,"note":null,"quote":"Soon we had cleared the Antarctic Circle plus the promontory of Cape Horn. We were abreast of the tip of South America by March 31 at seven o’clock in the evening. By then all our past sufferings were forgotten.","sourceLine":15680},{"id":"patagonia-apr3","name":"Patagonian waters","kidName":"Up the coast of Argentina","lat":-45,"lon":-60,"date":"1868-04-03","dateCertainty":"explicit","day":148,"ordinal":41,"part":2,"chapter":17,"chapterTitle":"From Cape Horn to the Amazon","leg":"nautilus","placeKind":"real","leagueMark":null,"note":null,"quote":"We didn’t leave these Patagonian waterways until April 3, sometimes cruising under the ocean, sometimes on its surface. The Nautilus passed the wide estuary formed by the mouth of the Rio de la Plata, and on April 4 we lay abreast of Uruguay, albeit fifty miles out.","sourceLine":15787},{"id":"uruguay","name":"Off Uruguay","kidName":"16,000 leagues covered","lat":-35,"lon":-55,"date":"1868-04-04","dateCertainty":"explicit","day":149,"ordinal":41,"part":2,"chapter":17,"chapterTitle":"From Cape Horn to the Amazon","leg":"nautilus","placeKind":"real","leagueMark":16000,"note":null,"quote":"The Nautilus passed the wide estuary formed by the mouth of the Rio de la Plata, and on April 4 we lay abreast of Uruguay, albeit fifty miles out. Keeping to its northerly heading, it followed the long windings of South America. By then we had fared 16,000 leagues since coming on board in the seas of Japan.","sourceLine":15792},{"id":"cape-sao-roque","name":"Eastern tip of Brazil","kidName":"The corner of South America","lat":-5.2,"lon":-35.5,"date":"1868-04-09","dateCertainty":"explicit","day":154,"ordinal":41,"part":2,"chapter":17,"chapterTitle":"From Cape Horn to the Amazon","leg":"nautilus","placeKind":"real","leagueMark":null,"note":null,"quote":"This speed was maintained for several days, and on the evening of April 9, we raised South America’s easternmost tip, Cape São Roque. But then the Nautilus veered away again and went looking for the lowest depths of an underwater valley gouged between this cape and Sierra Leone on the coast of Africa.","sourceLine":15803},{"id":"amazon-mouth","name":"Mouth of the Amazon","kidName":"Where the great river meets the sea","lat":0,"lon":-47,"date":"1868-04-11","dateCertainty":"explicit","day":156,"ordinal":41,"part":2,"chapter":17,"chapterTitle":"From Cape Horn to the Amazon","leg":"nautilus","placeKind":"real","leagueMark":null,"note":null,"quote":"The Nautilus would do long, diagonal dives that took us to every level. But on April 11 it rose suddenly, and the shore reappeared at the mouth of the Amazon River, a huge estuary whose outflow is so considerable, it desalts the sea over an area of several leagues.","sourceLine":15820},{"id":"west-indies","name":"Martinique and Guadeloupe","kidName":"17,000 leagues covered","lat":15.5,"lon":-61.3,"date":"1868-04-16","dateCertainty":"explicit","day":161,"ordinal":42,"part":2,"chapter":18,"chapterTitle":"The Devilfish","leg":"nautilus","placeKind":"real","leagueMark":17000,"note":null,"quote":"On April 16 we raised Martinique and Guadalupe from a distance of about thirty miles. For one instant I could see their lofty peaks.","sourceLine":16021},{"id":"the-devilfish","name":"Bahama Channel","kidName":"The giant squid!","lat":26.5,"lon":-76,"date":"1868-04-20","dateCertainty":"explicit","day":165,"ordinal":42,"part":2,"chapter":18,"chapterTitle":"The Devilfish","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"A pack of giant squid jams the propeller. The crew fight them hand to hand on the platform with axes and harpoons, and one of Nemo's men is carried away. Nemo weeps.","quote":"By April 20 we had risen to an average level of 1,500 meters. The nearest land was the island group of the Bahamas, scattered like a batch of cobblestones over the surface of the water. There high","sourceLine":16108},{"id":"gulf-stream","name":"The Gulf Stream","kidName":"A river inside the sea","lat":30,"lon":-79,"date":"1868-05-01","dateCertainty":"explicit","day":176,"ordinal":43,"part":2,"chapter":19,"chapterTitle":"The Gulf Stream","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"A warm current running through the cold ocean like a river with banks of its own. The Nautilus rides it north.","quote":"Ten days went by in this way. It was only on May 1 that the Nautilus openly resumed its northbound course, after raising the Bahamas at the mouth of Old Bahama Channel. We then went with the current of the sea’s greatest river, which has its own banks, fish, and temperature.","sourceLine":16518},{"id":"cape-hatteras","name":"Cape Hatteras","kidName":"Ned Land's escape plan","lat":35.25,"lon":-75.5,"date":"1868-05-08","dateCertainty":"explicit","day":183,"ordinal":43,"part":2,"chapter":19,"chapterTitle":"The Gulf Stream","leg":"nautilus","placeKind":"real","leagueMark":null,"note":null,"quote":"On May 8, while abreast of North Carolina, we were across from Cape Hatteras once more. There the Gulf Stream is seventy-five miles wide and 210 meters deep. The Nautilus continued to wander at random.","sourceLine":16614},{"id":"the-storm","name":"North Atlantic storm","kidName":"Riding out a hurricane","lat":40,"lon":-68,"date":"1868-05-13","dateCertainty":"explicit","day":188,"ordinal":43,"part":2,"chapter":19,"chapterTitle":"The Gulf Stream","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"Nemo stands lashed on the platform in the middle of it, letting the storm break over him, while the Nautilus simply dives below the waves to calm water.","quote":"The storm burst during the daytime of May 13, just as the Nautilus was cruising abreast of Long Island, a few miles from the narrows to Upper New York Bay. I’m able to describe this struggle of the elements because Captain Nemo didn’t flee into the ocean depths; instead, from some inexplicable whim, he decided to brave it out on the surface.","sourceLine":16826},{"id":"grand-banks","name":"Grand Banks of Newfoundland","kidName":"Fog and fishing boats","lat":43,"lon":-50,"date":"1868-05-15","dateCertainty":"explicit","day":190,"ordinal":44,"part":2,"chapter":20,"chapterTitle":"In Latitude 47° 24′ and Longitude 17° 28′","leg":"nautilus","placeKind":"real","leagueMark":null,"note":null,"quote":"By May 15 we were off the southern tip of the Grand Banks of Newfoundland. These banks are the result of marine sedimentation, an extensive accumulation of organic waste brought either from the equator by the Gulf Stream’s current, or from the North Pole by the countercurrent of cold water that skirts the American coast.","sourceLine":16965},{"id":"telegraph-cable","name":"The transatlantic cable","kidName":"Following the telegraph wire","lat":48,"lon":-41,"date":"1868-05-17","dateCertainty":"explicit","day":192,"ordinal":44,"part":2,"chapter":20,"chapterTitle":"In Latitude 47° 24′ and Longitude 17° 28′","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"They come across the cable that carries messages between America and Europe, lying on the sea bed, and follow it. It had only been working for two years when Verne wrote this.","quote":"It was on May 17, about 500 miles from Heart’s Content and 2,800 meters down, that I spotted this cable lying on the seafloor. Conseil, whom I hadn’t alerted, mistook it at first for a gigantic sea snake and was gearing up to classify it in his best manner.","sourceLine":17069},{"id":"cable-break","name":"Where the cable broke","kidName":"The spot where the wire snapped","lat":51.5,"lon":-19,"date":"1868-05-25","dateCertainty":"explicit","day":200,"ordinal":44,"part":2,"chapter":20,"chapterTitle":"In Latitude 47° 24′ and Longitude 17° 28′","leg":"nautilus","placeKind":"real","leagueMark":null,"note":null,"quote":"Now then, on May 25 while submerged to a depth of 3,836 meters, the Nautilus lay in precisely the locality where this second cable suffered the rupture that ruined the undertaking. It happened 638 miles from the coast of Ireland. At around two o’clock in the afternoon, all contact with Europe broke off.","sourceLine":17082},{"id":"lands-end","name":"Land's End, England","kidName":"So close to home","lat":49.9,"lon":-6.3,"date":"1868-05-30","dateCertainty":"explicit","day":205,"ordinal":44,"part":2,"chapter":20,"chapterTitle":"In Latitude 47° 24′ and Longitude 17° 28′","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"Within sight of England. If the Nautilus would only head east into the Channel, Ned Land could be ashore in a night. It does not.","quote":"But the Nautilus kept gravitating southward. On May 30, in sight of Land’s End, it passed between the lowermost tip of England and the Scilly Islands, which it left behind to starboard. If it was going to enter the English Channel, it clearly needed to head east.","sourceLine":17153},{"id":"the-avenger","name":"47 deg 24' N, 17 deg 28' W","kidName":"The spot Nemo was looking for","lat":47.4,"lon":-17.467,"date":"1868-06-01","dateCertainty":"explicit","day":207,"ordinal":44,"part":2,"chapter":20,"chapterTitle":"In Latitude 47° 24′ and Longitude 17° 28′","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"The Nautilus circles the same patch of empty ocean for days, searching. On the sea floor lies a wrecked warship - and this position gives the chapter its title. It is the grave of a ship that went down fighting rather than surrender.","quote":"The next day, June 1, the Nautilus kept to the same tack. It was obviously trying to locate some precise spot in the ocean. Just as on the day before, Captain Nemo came to take the altitude of the sun. The sea was smooth, the skies clear.","sourceLine":17171},{"id":"the-warship","name":"The attack","kidName":"Nemo sinks a warship","lat":47,"lon":-18,"date":"1868-06-02","dateCertainty":"explicit","day":208,"ordinal":45,"part":2,"chapter":21,"chapterTitle":"A Mass Execution","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"A warship attacks the Nautilus, and Nemo rams it below the waterline and takes it down with all hands, while Aronnax watches in horror. This is the moment Aronnax stops being able to admire him. Verne gives no date; it follows directly from 1 June.","quote":"I returned to the lounge. The Nautilus still emerged above the surface. A few morning gleams infiltrated the liquid strata. Beneath the undulations of the billows, the windows were enlivened by the blushing of the rising sun. That dreadful day of June 2 had dawned. At seven o’clock the log told me that the Nautilus had reduced speed.","sourceLine":17561},{"id":"north-atlantic-flight","name":"Running north","kidName":"Where is he taking us now?","lat":58,"lon":-10,"date":"1868-06-05","dateCertainty":"inferred","day":211,"ordinal":46,"part":2,"chapter":22,"chapterTitle":"The Last Words of Captain Nemo","leg":"nautilus","placeKind":"real","leagueMark":null,"note":"The Nautilus flies north with nobody steering her, deeper into seas no one knows. Aronnax, Conseil and Ned Land decide to escape that night.","quote":"By evening we had cleared 200 leagues up the Atlantic. Shadows gathered and gloom overran the sea until the moon came up. I repaired to my stateroom. I couldn’t sleep. I was assaulted by nightmares.","sourceLine":17684},{"id":"the-maelstrom","name":"The Maelstrom, Norway","kidName":"Into the great whirlpool","lat":67.9,"lon":12.9,"date":"1868-06-06","dateCertainty":"inferred","day":212,"ordinal":47,"part":2,"chapter":23,"chapterTitle":"Conclusion","leg":"nautilus","placeKind":"real","leagueMark":20000,"note":"The three cast off in the skiff at the worst possible moment - straight into the whirlpool between the Lofoten Islands. They wake in a fisherman's hut, alive. What became of the Nautilus, nobody knows. (Aronnax says the voyage covered 20,000 leagues 'in less than ten months', though the dates in the book run only from November to June - about seven.)","quote":"What happened that night, how the skiff escaped from the Maelstrom’s fearsome eddies, how Ned Land, Conseil, and I got out of that whirlpool, I’m unable to say. But when I regained consciousness, I was lying in a fisherman’s hut on one of the Lofoten Islands. My two companions, safe and sound, were at my bedside clasping my hands. We embraced each other heartily.","sourceLine":17954}],"land":[[[-59.57,-80.04],[-59.87,-80.55],[-60.16,-81],[-62.26,-80.86],[-64.49,-80.92],[-65.74,-80.59],[-65.74,-80.55],[-66.29,-80.26],[-64.04,-80.29],[-61.88,-80.39],[-61.14,-79.98],[-60.61,-79.63],[-59.57,-80.04]],[[-159.21,-79.5],[-161.13,-79.63],[-162.44,-79.28],[-163.03,-78.93],[-163.07,-78.87],[-163.71,-78.6],[-163.11,-78.22],[-161.25,-78.38],[-160.25,-78.69],[-159.48,-79.05],[-159.21,-79.5]],[[-45.15,-78.05],[-43.92,-78.48],[-43.49,-79.09],[-43.37,-79.52],[-43.33,-80.03],[-44.88,-80.34],[-46.51,-80.59],[-48.39,-80.83],[-50.48,-81.03],[-52.85,-80.97],[-54.16,-80.63],[-53.99,-80.22],[-51.85,-79.95],[-50.99,-79.61],[-50.36,-79.18],[-49.91,-78.81],[-49.31,-78.46],[-48.66,-78.05],[-48.15,-78.05],[-46.66,-77.83],[-45.15,-78.05]],[[-121.21,-73.5],[-119.92,-73.66],[-118.72,-73.48],[-119.29,-73.83],[-120.23,-74.09],[-121.62,-74.01],[-122.62,-73.66],[-122.41,-73.32],[-121.21,-73.5]],[[-125.56,-73.48],[-124.03,-73.87],[-124.62,-73.83],[-125.91,-73.74],[-127.28,-73.46],[-126.56,-73.25],[-125.56,-73.48]],[[-98.98,-71.93],[-97.88,-72.07],[-96.79,-71.95],[-96.2,-72.52],[-96.98,-72.44],[-98.2,-72.48],[-99.43,-72.44],[-100.78,-72.5],[-101.8,-72.31],[-102.33,-71.89],[-101.7,-71.72],[-100.43,-71.85], const SVGNS = "http://www.w3.org/2000/svg";

/* ---------- projection: equirectangular, so lon/lat map straight to x/y ---- */
const W = 720, H = 360;
const px = (lon) => (lon + 180) * (W / 360);
const py = (lat) => (90 - lat) * (H / 180);

/* ---------- persistence: file:// can throw on localStorage, so guard both -- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }
              catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* memory only */ } },
};

// Only the three tracks are switchable. Invented places stay drawn - they are
// told apart by their dashed ring, not by a toggle.
const DEFAULT_LAYERS = { sighting: true, abraham_lincoln: true, nautilus: true };
const state = {
  gate: Math.min(47, Math.max(1, store.get("nautilus.gate", 1))),
  reveal: !!store.get("nautilus.reveal", false),
  layers: { ...DEFAULT_LAYERS, ...store.get("nautilus.layers", {}) },
  selected: null,
  playing: false,
};
const effGate = () => (state.reveal ? 47 : state.gate);

const svg = document.getElementById("map");
svg.setAttribute("viewBox", `-10 -10 ${W + 20} ${H + 20}`);

// The world is drawn as a strip of identical copies side by side, and panning
// wraps, so the Pacific can be followed straight through the dateline instead of
// jumping from one edge to the other. COPIES spans far enough that the route -
// which runs about 300 degrees of longitude end to end - is always covered.
const COPIES = [-2, -1, 0, 1, 2];

const gRoot = document.createElementNS(SVGNS, "g");
svg.appendChild(gRoot);
const layer = (cls) => { const g = document.createElementNS(SVGNS, "g"); g.setAttribute("class", cls); gRoot.appendChild(g); return g; };
const gSea = layer("sea"), gTile = layer("tile"), gTiles = layer("tiles"),
      gRoute = layer("route"), gPts = layer("pts"), gLbl = layer("lbl");
gTile.setAttribute("id", "worldtile");
const gGrid = document.createElementNS(SVGNS, "g"), gLand = document.createElementNS(SVGNS, "g");
gTile.append(gGrid, gLand);

const el = (name, attrs, parent) => {
  const n = document.createElementNS(SVGNS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;

/* ---------- static layers ------------------------------------------------- */
// one continuous ocean behind every copy, so no seam shows between them
el("rect", { x: COPIES[0] * W, y: 0, width: COPIES.length * W, height: H, fill: "var(--ocean)" }, gSea);

for (let lon = -180; lon <= 180; lon += 30)
  el("line", { x1: px(lon), y1: 0, x2: px(lon), y2: H, stroke: "var(--grid)", "stroke-width": .5, "vector-effect": "non-scaling-stroke" }, gGrid);

  el("line", { x1: 0, y1: py(lat), x2: W, y2: py(lat), stroke: "var(--grid)", "stroke-width": .5, "vector-effect": "non-scaling-stroke" }, gGrid);

for (const [lat, dash] of [[0, ""], [23.44, "3 3"], [-23.44, "3 3"], [66.56, "1 4"], [-66.56, "1 4"]])
  el("line", {
    x1: 0, y1: py(lat), x2: W, y2: py(lat), stroke: "#24486b",
    "stroke-width": .8, "stroke-dasharray": dash, "vector-effect": "non-scaling-stroke",
  }, gGrid);

for (const ring of DATA.land) {
  const d = ring.map((p, i) => (i ? "L" : "M") + px(p[0]).toFixed(1) + " " + py(p[1]).toFixed(1)).join("") + "Z";
